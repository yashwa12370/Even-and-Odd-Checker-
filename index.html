<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Evenly - Even & Odd Checker</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">
<header>
  <div class="logo">EVENLY</div>
  <button id="theme">☾</button>
</header>

<p class="tag">EVEN & ODD CHECKER</p>
<h1>Check Your Number</h1>
<p class="sub">Enter any whole number and instantly discover its type.</p>

<main>
<input id="num" type="number" step="1" placeholder="Enter a number">

<div class="buttons">
  <button id="check">CHECK NUMBER</button>
  <button id="random">🎲 Random</button>
  <button id="clear">Clear</button>
</div>

<section id="result" class="result">
  <span id="icon">✓</span>
  <small>RESULT</small>
  <strong id="answer">—</strong>
  <p id="detail">Your result will appear here.</p>
</section>

<div class="stats">
  <div><b id="total">0</b><span>TOTAL</span></div>
  <div><b id="even">0</b><span>EVEN</span></div>
  <div><b id="odd">0</b><span>ODD</span></div>
</div>

<div class="recent">
  <div class="recent-head">
    <h3>Recent Checks</h3>
    <button id="clearHistory">Clear</button>
  </div>
  <ul id="history"></ul>
</div>
</main>
</div>

<script src="script.js"></script>
</body>
</html>
